<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="40" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Three-Tier Architecture</text>

  <!-- ===================== Presentation tier ===================== -->
  <g>
    <rect x="70" y="80" width="860" height="150" rx="8" fill="#f0f9f4" stroke="#2f7a52" stroke-width="2"/>
    <rect x="70" y="80" width="240" height="150" rx="8" fill="#dbf0e3"/>
    <text x="190" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Presentation Tier</text>
    <text x="190" y="172" font-size="12.5" text-anchor="middle" fill="#266143">Client (browser)</text>

    <rect x="345" y="110" width="170" height="90" rx="6" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="430" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a3f2d">React SPA</text>
    <text x="430" y="160" font-size="11" text-anchor="middle" fill="#444">Vite + Tailwind</text>
    <text x="430" y="178" font-size="11" text-anchor="middle" fill="#444">5 pages, design system</text>

    <rect x="545" y="110" width="170" height="90" rx="6" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="630" y="140" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Applicant UI</text>
    <text x="630" y="160" font-size="11" text-anchor="middle" fill="#444">form + documents</text>

    <rect x="745" y="110" width="170" height="90" rx="6" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="830" y="140" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Employee UI</text>
    <text x="830" y="160" font-size="11" text-anchor="middle" fill="#444">dashboard + review</text>
  </g>

  <!-- arrow PRESENTATION <-> LOGIC -->
  <g>
    <line x1="500" y1="230" x2="500" y2="290" stroke="#266143" stroke-width="2"/>
    <polygon points="500,290 494,278 506,278" fill="#266143"/>
    <polygon points="500,230 494,242 506,242" fill="#266143"/>
    <rect x="540" y="245" width="190" height="30" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="635" y="265" font-size="12" text-anchor="middle" fill="#266143">HTTPS / REST (JSON, JWT)</text>
  </g>

  <!-- ===================== Logic tier ===================== -->
  <g>
    <rect x="70" y="300" width="860" height="170" rx="8" fill="#f0f9f4" stroke="#2f7a52" stroke-width="2"/>
    <rect x="70" y="300" width="240" height="170" rx="8" fill="#dbf0e3"/>
    <text x="190" y="378" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Business-Logic Tier</text>
    <text x="190" y="402" font-size="12.5" text-anchor="middle" fill="#266143">FastAPI server</text>

    <rect x="345" y="330" width="170" height="115" rx="6" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="430" y="356" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a3f2d">REST API</text>
    <text x="430" y="376" font-size="10.5" text-anchor="middle" fill="#444">/apply · /review</text>
    <text x="430" y="392" font-size="10.5" text-anchor="middle" fill="#444">/decision · /documents</text>
    <text x="430" y="412" font-size="10.5" text-anchor="middle" fill="#444">JWT auth · Pydantic</text>
    <text x="430" y="430" font-size="10.5" text-anchor="middle" fill="#444">workflow rules</text>

    <rect x="545" y="330" width="170" height="115" rx="6" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="630" y="356" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a3f2d">MLP model</text>
    <text x="630" y="376" font-size="10.5" text-anchor="middle" fill="#444">NumPy, 11→16→1</text>
    <text x="630" y="392" font-size="10.5" text-anchor="middle" fill="#444">scale_input()</text>
    <text x="630" y="408" font-size="10.5" text-anchor="middle" fill="#444">model_weights.npz</text>
    <text x="630" y="424" font-size="10.5" text-anchor="middle" fill="#444">scale_params.json</text>

    <rect x="745" y="330" width="170" height="115" rx="6" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="830" y="356" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Services</text>
    <text x="830" y="376" font-size="10.5" text-anchor="middle" fill="#444">SQLAlchemy ORM</text>
    <text x="830" y="392" font-size="10.5" text-anchor="middle" fill="#444">SMTP e-mail</text>
    <text x="830" y="408" font-size="10.5" text-anchor="middle" fill="#444">bcrypt hashing</text>
  </g>

  <!-- arrow LOGIC <-> DATA -->
  <g>
    <line x1="500" y1="470" x2="500" y2="530" stroke="#266143" stroke-width="2"/>
    <polygon points="500,530 494,518 506,518" fill="#266143"/>
    <polygon points="500,470 494,482 506,482" fill="#266143"/>
    <rect x="540" y="485" width="190" height="30" rx="4" fill="#fff" stroke="#ccc"/>
    <text x="635" y="505" font-size="12" text-anchor="middle" fill="#266143">SQL (SQLAlchemy ORM)</text>
  </g>

  <!-- ===================== Data tier ===================== -->
  <g>
    <rect x="70" y="540" width="860" height="130" rx="8" fill="#f0f9f4" stroke="#2f7a52" stroke-width="2"/>
    <rect x="70" y="540" width="240" height="130" rx="8" fill="#dbf0e3"/>
    <text x="190" y="598" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Data Tier</text>
    <text x="190" y="622" font-size="12.5" text-anchor="middle" fill="#266143">MySQL database</text>

    <!-- cylinder -->
    <g>
      <ellipse cx="500" cy="575" rx="60" ry="14" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
      <path d="M440,575 L440,635 A60,14 0 0 0 560,635 L560,575" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
      <ellipse cx="500" cy="575" rx="60" ry="14" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
      <text x="500" y="615" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a3f2d">loan_db</text>
    </g>

    <rect x="640" y="568" width="270" height="86" rx="6" fill="#ffffff" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="775" y="590" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Tables</text>
    <text x="775" y="610" font-size="11" text-anchor="middle" fill="#444">employees · applications · documents</text>
    <text x="775" y="630" font-size="10.5" text-anchor="middle" fill="#555">(applications = 4 lifecycle zones)</text>
  </g>
</svg>
