<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1180" font-family="Arial, Helvetica, sans-serif">
  <rect width="1180" height="1180" fill="#ffffff"/>
  <text x="590" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Sequence Diagram — Two-Phase Loan Application Flow</text>

  <!-- ===== Lifelines header boxes ===== -->
  <!-- positions -->
  <!-- Applicant 90 | Frontend 290 | FastAPI 500 | MySQL 710 | MLP 900 | Employee 1090 -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="40" y="56" width="100" height="38" rx="5" fill="#2f7a52"/><text x="90" y="80" fill="#fff">Applicant</text>
    <rect x="232" y="56" width="116" height="38" rx="5" fill="#2f7a52"/><text x="290" y="80" fill="#fff">Frontend (React)</text>
    <rect x="448" y="56" width="104" height="38" rx="5" fill="#2f7a52"/><text x="500" y="80" fill="#fff">FastAPI</text>
    <rect x="668" y="56" width="84" height="38" rx="5" fill="#2f7a52"/><text x="710" y="80" fill="#fff">MySQL</text>
    <rect x="852" y="56" width="96" height="38" rx="5" fill="#2f7a52"/><text x="900" y="80" fill="#fff">MLP model</text>
    <rect x="1030" y="56" width="120" height="38" rx="5" fill="#266143"/><text x="1090" y="80" fill="#fff">Bank employee</text>
  </g>

  <!-- ===== Lifelines ===== -->
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="4,4">
    <line x1="90" y1="94" x2="90" y2="1140"/>
    <line x1="290" y1="94" x2="290" y2="1140"/>
    <line x1="500" y1="94" x2="500" y2="1140"/>
    <line x1="710" y1="94" x2="710" y2="1140"/>
    <line x1="900" y1="94" x2="900" y2="1140"/>
    <line x1="1090" y1="94" x2="1090" y2="1140"/>
  </g>

  <!-- arrow marker -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#888"/></marker>
  </defs>

  <!-- ============ PHASE 1 : APPLICANT SUBMISSION (no prediction) ============ -->
  <rect x="40" y="108" width="1110" height="26" fill="#dbf0e3"/>
  <text x="52" y="126" font-size="13" font-weight="bold" fill="#1a3f2d">Phase 1 — Applicant submission  (status: SUBMITTED — model does NOT run yet)</text>

  <g font-size="11.5" fill="#222">
    <line x1="90" y1="158" x2="288" y2="158" stroke="#333" marker-end="url(#arr)"/>
    <text x="110" y="152">Fill form + upload documents</text>

    <line x1="290" y1="186" x2="498" y2="186" stroke="#333" marker-end="url(#arr)"/>
    <text x="300" y="180">POST /apply (multipart/form-data)</text>

    <line x1="500" y1="214" x2="708" y2="214" stroke="#333" marker-end="url(#arr)"/>
    <text x="512" y="208">INSERT application (status=SUBMITTED) + documents</text>

    <line x1="708" y1="240" x2="502" y2="240" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
    <text x="540" y="234" fill="#555">application_id</text>

    <line x1="498" y1="266" x2="292" y2="266" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
    <text x="320" y="260" fill="#555">201 Created — application_id (no prediction)</text>

    <line x1="288" y1="292" x2="92" y2="292" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
    <text x="120" y="286" fill="#555">Show confirmation page (reference #)</text>
  </g>

  <!-- ============ PHASE 2 : EMPLOYEE LOGIN + REVIEW ============ -->
  <rect x="40" y="312" width="1110" height="26" fill="#dbf0e3"/>
  <text x="52" y="330" font-size="13" font-weight="bold" fill="#1a3f2d">Phase 2 — Employee login, document review &amp; prediction</text>

  <g font-size="11.5" fill="#222">
    <line x1="1090" y1="362" x2="502" y2="362" stroke="#333" marker-end="url(#arr)"/>
    <text x="640" y="356">POST /login (email, password)</text>
    <line x1="500" y1="388" x2="708" y2="388" stroke="#333" marker-end="url(#arr)"/>
    <text x="512" y="382">verify credentials (bcrypt)</text>
    <line x1="498" y1="414" x2="1088" y2="414" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <text x="640" y="408" fill="#555">JWT token</text>

    <line x1="1090" y1="446" x2="502" y2="446" stroke="#333" marker-end="url(#arr)"/>
    <text x="600" y="440">GET /applications (JWT)  → list with statuses</text>

    <line x1="1090" y1="476" x2="502" y2="476" stroke="#333" marker-end="url(#arr)"/>
    <text x="560" y="470">GET /applications/{id}  → details + documents</text>

    <line x1="1090" y1="506" x2="502" y2="506" stroke="#333" marker-end="url(#arr)"/>
    <text x="560" y="500">GET /documents/{id} (JWT) → view document to verify</text>
    <line x1="498" y1="532" x2="1088" y2="532" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <text x="650" y="526" fill="#555">file (blob)</text>
  </g>

  <!-- The pivotal review-and-predict step -->
  <rect x="40" y="556" width="1110" height="24" fill="#f0f9f4"/>
  <text x="52" y="573" font-size="12.5" font-weight="bold" fill="#266143">Employee enters VERIFIED financial fields → triggers the model</text>

  <g font-size="11.5" fill="#222">
    <line x1="1090" y1="606" x2="502" y2="606" stroke="#333" marker-end="url(#arr)"/>
    <text x="560" y="600">POST /applications/{id}/review (verified fields, JWT)</text>
    <text x="560" y="618" font-size="10" fill="#777">guard: status must be SUBMITTED</text>

    <line x1="500" y1="648" x2="708" y2="648" stroke="#333" marker-end="url(#arr)"/>
    <text x="512" y="642">save verified fields</text>

    <line x1="500" y1="680" x2="898" y2="680" stroke="#333" marker-end="url(#arr)"/>
    <text x="560" y="674">assemble 11 features → scale_input(): log1p + MinMax</text>

    <rect x="852" y="694" width="96" height="40" rx="4" fill="#f0f9f4" stroke="#2f7a52"/>
    <text x="900" y="710" font-size="10.5" text-anchor="middle" fill="#1a3f2d">forward pass</text>
    <text x="900" y="724" font-size="10.5" text-anchor="middle" fill="#1a3f2d">(1, 11) → σ</text>

    <line x1="898" y1="754" x2="502" y2="754" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
    <text x="600" y="748" fill="#555">probability (e.g. 0.106) + verdict (threshold 0.4)</text>

    <line x1="500" y1="782" x2="708" y2="782" stroke="#333" marker-end="url(#arr)"/>
    <text x="512" y="776">UPDATE: probability, verdict, status=PREDICTED, predicted_at</text>

    <line x1="498" y1="810" x2="1088" y2="810" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <text x="600" y="804" fill="#555">200 OK — prediction shown to employee</text>
  </g>

  <!-- ============ PHASE 3 : DECISION + NOTIFICATION ============ -->
  <rect x="40" y="836" width="1110" height="26" fill="#dbf0e3"/>
  <text x="52" y="854" font-size="13" font-weight="bold" fill="#1a3f2d">Phase 3 — Decision &amp; notification  (employee weighs risk + loan amount vs income)</text>

  <g font-size="11.5" fill="#222">
    <line x1="1090" y1="886" x2="502" y2="886" stroke="#333" marker-end="url(#arr)"/>
    <text x="560" y="880">POST /applications/{id}/decision (accept | refuse, JWT)</text>
    <text x="560" y="898" font-size="10" fill="#777">guard: status must be PREDICTED</text>

    <line x1="500" y1="928" x2="708" y2="928" stroke="#333" marker-end="url(#arr)"/>
    <text x="512" y="922">UPDATE status=ACCEPTED/REFUSED, decided_by, decided_at</text>

    <line x1="500" y1="962" x2="92" y2="962" stroke="#333" marker-end="url(#arr)"/>
    <text x="150" y="956">Send decision email (SMTP) → email_sent=true</text>

    <line x1="498" y1="990" x2="1088" y2="990" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <text x="620" y="984" fill="#555">200 OK — decision saved</text>

    <line x1="90" y1="1018" x2="90" y2="1018" stroke="#333"/>
    <circle cx="90" cy="1018" r="3" fill="#266143"/>
    <text x="100" y="1022" fill="#266143" font-style="italic">Applicant receives the decision by email</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="40" y="1050" width="430" height="86" rx="6" fill="#f7f9f8" stroke="#ccc"/>
    <text x="52" y="1072" font-size="12" font-weight="bold" fill="#1a3f2d">Legend</text>
    <line x1="52" y1="1090" x2="100" y2="1090" stroke="#333" marker-end="url(#arr)"/>
    <text x="110" y="1094" font-size="11" fill="#333">Synchronous call</text>
    <line x1="52" y1="1112" x2="100" y2="1112" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
    <text x="110" y="1116" font-size="11" fill="#333">Return / response</text>
    <text x="240" y="1094" font-size="11" font-style="italic" fill="#266143">Key: prediction runs in Phase 2</text>
    <text x="240" y="1110" font-size="11" font-style="italic" fill="#266143">(employee review), NOT at submission.</text>
  </g>
</svg>
