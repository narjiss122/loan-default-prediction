<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Arial, Helvetica, sans-serif">
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="590" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Use Case Diagram — Loan Default Risk Prediction System</text>

  <!-- System boundary -->
  <rect x="300" y="70" width="580" height="650" rx="10" fill="none" stroke="#2f7a52" stroke-width="2"/>
  <text x="590" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#266143">Loan Risk Prediction System</text>

  <!-- ===== Actors ===== -->
  <!-- Applicant -->
  <g stroke="#1a3f2d" stroke-width="2" fill="none">
    <circle cx="120" cy="200" r="16" fill="#f0f9f4"/>
    <line x1="120" y1="216" x2="120" y2="258"/>
    <line x1="92" y1="232" x2="148" y2="232"/>
    <line x1="120" y1="258" x2="98" y2="292"/>
    <line x1="120" y1="258" x2="142" y2="292"/>
  </g>
  <text x="120" y="316" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Applicant</text>

  <!-- Bank employee -->
  <g stroke="#1a3f2d" stroke-width="2" fill="none">
    <circle cx="120" cy="500" r="16" fill="#f0f9f4"/>
    <line x1="120" y1="516" x2="120" y2="558"/>
    <line x1="92" y1="532" x2="148" y2="532"/>
    <line x1="120" y1="558" x2="98" y2="592"/>
    <line x1="120" y1="558" x2="142" y2="592"/>
  </g>
  <text x="120" y="616" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a3f2d">Bank employee</text>

  <!-- System (automated) actor -->
  <g stroke="#b07726" stroke-width="2" fill="none">
    <circle cx="1060" cy="430" r="16" fill="#fefdf8"/>
    <line x1="1060" y1="446" x2="1060" y2="488"/>
    <line x1="1032" y1="462" x2="1088" y2="462"/>
    <line x1="1060" y1="488" x2="1038" y2="522"/>
    <line x1="1060" y1="488" x2="1082" y2="522"/>
  </g>
  <text x="1060" y="546" font-size="13" font-weight="bold" text-anchor="middle" fill="#8c5d1f">System</text>
  <text x="1060" y="563" font-size="13" font-weight="bold" text-anchor="middle" fill="#8c5d1f">(automated)</text>

  <!-- ===== Applicant use cases ===== -->
  <g>
    <ellipse cx="470" cy="150" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="155" font-size="12.5" text-anchor="middle" fill="#1a3f2d">Submit loan application</text>

    <ellipse cx="470" cy="220" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="218" font-size="12" text-anchor="middle" fill="#1a3f2d">Upload documents</text>
    <text x="470" y="232" font-size="10" text-anchor="middle" fill="#555">(by professional status)</text>

    <ellipse cx="470" cy="290" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="288" font-size="11.5" text-anchor="middle" fill="#1a3f2d">Receive decision</text>
    <text x="470" y="302" font-size="11.5" text-anchor="middle" fill="#1a3f2d">notification (email)</text>
  </g>

  <!-- ===== Employee use cases ===== -->
  <g>
    <ellipse cx="470" cy="380" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="385" font-size="12.5" text-anchor="middle" fill="#1a3f2d">Log in to dashboard</text>

    <ellipse cx="470" cy="445" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="450" font-size="12.5" text-anchor="middle" fill="#1a3f2d">View applications</text>

    <ellipse cx="470" cy="510" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="515" font-size="12.5" text-anchor="middle" fill="#1a3f2d">View uploaded documents</text>

    <ellipse cx="700" cy="510" rx="128" ry="30" fill="#dbf0e3" stroke="#2f7a52" stroke-width="2"/>
    <text x="700" y="507" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a3f2d">Enter / verify financial</text>
    <text x="700" y="523" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a3f2d">information &amp; run review</text>

    <ellipse cx="470" cy="585" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="582" font-size="12" text-anchor="middle" fill="#1a3f2d">View model prediction</text>
    <text x="470" y="596" font-size="11" text-anchor="middle" fill="#555">(probability + verdict)</text>

    <ellipse cx="470" cy="655" rx="120" ry="26" fill="#f0f9f4" stroke="#2f7a52" stroke-width="1.5"/>
    <text x="470" y="660" font-size="12.5" text-anchor="middle" fill="#1a3f2d">Accept or refuse</text>
  </g>

  <!-- ===== System (automated) use cases ===== -->
  <g>
    <ellipse cx="700" cy="370" rx="118" ry="26" fill="#fefdf8" stroke="#b07726" stroke-width="1.5"/>
    <text x="700" y="375" font-size="12" text-anchor="middle" fill="#8c5d1f">Apply preprocessing</text>

    <ellipse cx="700" cy="435" rx="118" ry="26" fill="#fefdf8" stroke="#b07726" stroke-width="1.5"/>
    <text x="700" y="440" font-size="12" text-anchor="middle" fill="#8c5d1f">Run MLP prediction</text>

    <ellipse cx="700" cy="630" rx="118" ry="26" fill="#fefdf8" stroke="#b07726" stroke-width="1.5"/>
    <text x="700" y="635" font-size="12" text-anchor="middle" fill="#8c5d1f">Send email notification</text>
  </g>

  <!-- ===== Associations: Applicant ===== -->
  <line x1="148" y1="220" x2="350" y2="155" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="225" x2="350" y2="220" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="235" x2="350" y2="288" stroke="#555" stroke-width="1.2"/>

  <!-- ===== Associations: Employee ===== -->
  <line x1="148" y1="520" x2="350" y2="385" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="522" x2="350" y2="445" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="528" x2="350" y2="510" stroke="#555" stroke-width="1.2"/>
  <line x1="160" y1="540" x2="575" y2="510" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="545" x2="350" y2="585" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="555" x2="350" y2="655" stroke="#555" stroke-width="1.2"/>

  <!-- ===== Associations: System actor ===== -->
  <line x1="1032" y1="430" x2="818" y2="435" stroke="#b07726" stroke-width="1.2"/>
  <line x1="1040" y1="445" x2="818" y2="375" stroke="#b07726" stroke-width="1.2"/>
  <line x1="1044" y1="455" x2="818" y2="628" stroke="#b07726" stroke-width="1.2"/>

  <!-- ===== include: review includes preprocessing + prediction ===== -->
  <g stroke="#266143" stroke-width="1.3" stroke-dasharray="6,4" fill="none">
    <line x1="700" y1="480" x2="700" y2="461"/>
    <line x1="690" y1="487" x2="700" y2="400"/>
  </g>
  <polygon points="700,461 696,470 704,470" fill="#266143"/>
  <polygon points="700,400 695,409 705,408" fill="#266143"/>
  <text x="712" y="476" font-size="10" fill="#266143" font-style="italic">«include»</text>
  <text x="712" y="412" font-size="10" fill="#266143" font-style="italic">«include»</text>

  <!-- decision includes notification -->
  <line x1="585" y1="655" x2="582" y2="630" stroke="#266143" stroke-width="1.3" stroke-dasharray="6,4"/>
  <polygon points="582,630 577,639 587,638" fill="#266143"/>
  <text x="500" y="628" font-size="10" fill="#266143" font-style="italic">«include»</text>

  <!-- Legend -->
  <g>
    <rect x="900" y="640" width="260" height="100" rx="6" fill="#f7f9f8" stroke="#ccc"/>
    <text x="912" y="662" font-size="12" font-weight="bold" fill="#1a3f2d">Legend</text>
    <line x1="912" y1="680" x2="944" y2="680" stroke="#555" stroke-width="1.2"/>
    <text x="952" y="684" font-size="11" fill="#333">Association</text>
    <line x1="912" y1="702" x2="944" y2="702" stroke="#266143" stroke-width="1.3" stroke-dasharray="6,4"/>
    <text x="952" y="706" font-size="11" fill="#333">«include»</text>
    <ellipse cx="924" cy="724" rx="12" ry="7" fill="#f0f9f4" stroke="#2f7a52"/>
    <text x="952" y="728" font-size="11" fill="#333">Use case</text>
  </g>
</svg>
